<!-- 1) შექმენით 5 პარაგრაფი და მიეცით სხვადასხვა სტილები style ელემენტის გამოყენებით, შეუცვალეთ ზომაც და ფერიც. -->

    <p style="font-size:30px; color:rgb(255, 0, 0);">დედა მინდა</p>
    <p style="font-size:23px; color:rgb(189, 189, 229);">მამა მინდა</p>
    <p style="font-size:37px; color:rgb(157, 107, 42);">გურჯაანის ნაყინი</p>
    <p style="font-size:69px; color:rgb(46, 34, 181);">არ ვიცი რამე</p>
    <p style="font-size:21px; color:rgb(63, 7, 63);">გელას მამალაშას მამაგარდაიცვალა და მოგვიანებით დარეკეთ</p>

<!-- 2) დაწერეთ 6 ცალი სათაური: h1, h2, h3, h4, h5, h6 და font-size-ის საშუალებით შეცვალეთ ყველა სათაურის ზომები ისე რომ h6 იყოს ყველაზე დიდი სათაური, h5 ზომით უფრო პატარა, და ასე შემდეგ, h1 გახადეთ ყველაზე პატარა სათაური. -->

    <h1 style="font-size:20px;">შევარდნაძეს</h1>
    <h2 style="font-size:30px;">დდდდ</h2>
    <h3 style="font-size:50px;">რა დროშა მოგვცა მიშამა</h3>
    <h4 style="font-size:60px;">დროშა ვერ დაკიდეს</h4>
    <h5 style="font-size:67px;">დღეს ყველაზე მაგარია ჩემი ბებო</h5>
    <h6 style="font-size:69px;">ერთი ერთზე ნაცემი ყავს რემბო</h6>

<!-- 3) შექმენით პარაგრაფი და რაიმე სათაური, პარაგრაფი გასტილეთ, მიეცით ზომა 100px და მიანიჭეთ წითელი ფერი, ხოლო სათაური დააპატარავეთ - გახადეთ 10px, და მიანიჭეთ ლურჯი ფერი. -->

    <h2 style="font-size:10px; color:blue;">რამე სათაური</h2>
    <p style="font-size:100px; color:red;">პარაგრაფი გასტილეთ</p>

<!-- 4) კომენტარის სახით ახსენით რას აკეთებს style, font-size და color კუთვნილებები. -->

<!-- style — ამ თეგში უნდა ჩავწეროთ თუ როგორ გვინდა შევცვალოთ რომელიმე ტექსტი ან ფოტო (გავსტილოთ)
    font-size — აკონტროლებს ზომას ტექსტისას
    color — ფერებს აკონტროლებს-->
