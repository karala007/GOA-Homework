<html>

<head>

    <title>რეგისტრაციის ფორმა</title>

</head>

<body>

<form>

    <label for="username">სახელი:</label>
    <input type="text" id="username" name="username" required>
    
    <br><br>

    <label for="email">მეილი:</label>
    <input type="email" id="email" name="email" required>
    
    <br><br>

    <label for="password">პაროლი:</label>
    <input type="password" id="password" name="password" required>
    
    <br><br>

    <label for="brand">მანქანიები:</label>

    <select id="brand" name="brand">

        <option value="bugatti" selected>Bugatti</option>
        <option value="ford">ford</option>
        <option value="lotus">lotus</option>
        <option value="kamazi">kamazi</option>

    </select>

    <br><br>

    <input type="submit" value="გაგზავნა">

</form>
