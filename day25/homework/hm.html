<head>

    <title>reg form</title>

</head>

<body>

    <h2><u>register here</u></h2>

    <br>

<form>


    <label for="username">username:</label> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <input type="text" id="first name" required>

<br><br>

    <label for="password">Password:</label> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <input type="password" id="password" required>

<br><br>

    <label for="email">Email:</label> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <input type="email" id="email" required>

<br><br>

    <label for="gender">Gender:</label> &nbsp;&nbsp;&nbsp;&nbsp;

    <label for="male">Male</label>
    <input type="radio" id="male" name="gender" required>
        
    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" required>
        
    <label for="other">other</label>
    <input type="radio" id="other" name="gender" required>
        
<br><br>

    <label for="number">phone:</label>

        <select id="region" name="call id country">

        <option value="+995" selected>+995</option>
        <option value="+256">+256</option>
        <option value="+442">+442</option>
        <option value="+222">+222</option>

        </select>

    <input type="number" id="number" name="phone_number" required>

    <br><br>

    <input type="submit" value="გაგზავნა">



</form>


</body>
