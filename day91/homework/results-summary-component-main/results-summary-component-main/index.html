<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="stylesheet" href="css.css">
  
  <title>Frontend Mentor | Results summary component</title>

</head>
<body>

<main class="card">
        <section class="result-panel">
            <h2 class="panel-title">Your Result</h2>
            <div class="score-circle">
                <div class="score-big">76</div>
                <small class="score-total">of 100</small>
            </div>
            <div class="result-text">
                <h3>Great</h3>
                <p>You scored higher than 65% of the people who have taken these tests.</p>
            </div>
        </section>

        <section class="summary-panel">
            <h2 class="summary-title">Summary</h2>
            
            <div class="stats-container">
                <div class="stat-item reaction">
                    <div class="stat-label">
                        <img src="icon-reaction.svg" alt="Reaction">
                        <div class="category-name">Reaction</div>
                    </div>
                    <p class="stat-score"><b>80</b> / 100</p>
                </div>

                <div class="stat-item memory">
                    <div class="stat-label">
                        <img src="icon-memory.svg" alt="Memory">
                        <div class="category-name">Memory</div>
                    </div>
                    <p class="stat-score"><b>92</b> / 100</p>
                </div>

                <div class="stat-item verbal">
                    <div class="stat-label">
                        <img src="icon-verbal.svg" alt="Verbal">
                        <div class="category-name">Verbal</div>
                    </div>
                    <p class="stat-score"><b>61</b> / 100</p>
                </div>

                <div class="stat-item visual">
                    <div class="stat-label">
                        <img src="icon-visual.svg" alt="Visual">
                        <div class="category-name">Visual</div>
                    </div>
                    <p class="stat-score"><b>73</b> / 100</p>
                </div>
            </div>

            <button class="btn-continue">Continue</button>
        </section>
    </main>

</body>
</html>
